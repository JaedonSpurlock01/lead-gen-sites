  - type: prose
    tone: alt
    eyebrow: Cold-climate design
    heading: Plan for bright summers and snowy winters
    paragraphs:
      - Idaho Falls receives useful sunshine, but power output changes through the year. Summer days are long. Winter days are shorter, the sun sits lower, and storms or snow cover may block light for a time. A yearly estimate should use seasonal conditions rather than multiply one strong summer day across every month.
      - Cold weather does not stop a solar panel from making electricity when sunlight reaches it. Snow cover, however, can reduce output until it melts or slides. Roof slope, panel position, roof valleys, nearby walls, and drifting patterns can affect where snow collects. The plan should also leave room for drainage and required roof access.
      - Homeowners should not climb onto a snowy or icy roof to clear panels. Solar wiring can remain active in daylight, and hidden ice adds a serious fall risk. If a panel, mount, or wire looks damaged after a storm, keep a safe distance and request a repair check.
      - Idaho Falls weather also includes wind, spring dust, dry periods, and wide temperature changes. Mounts, roof connections, and electrical parts must match the approved design. Production claims should account for the actual roof, equipment, weather, shade, and system losses.
    bullets:
      - Short winter days and low sun angles
      - Temporary snow cover and drifting
      - Wind exposure and secure mounting
      - Seasonal shade from trees and buildings
    image: section2
    imageAlt: Rooftop solar panels after snow in Idaho Falls, Idaho
  - type: prose
    eyebrow: Permits and utility review
    heading: Include city and Idaho Falls Power steps in the schedule
    paragraphs:
      - The City of Idaho Falls provides a permit application for photovoltaic solar systems. It asks for project details, panel type, roof type, and whether the panels are roof- or ground-mounted. The full package can vary with the property and design, so the current city instructions should guide each job.
      - For a property served by Idaho Falls Power, the utility also reviews a system that will connect to its grid. Current materials ask for a grid-connection application, a one-line electrical drawing, equipment information, and installer details. Idaho Falls Power advises customers to contact the utility about system size limits before buying equipment.
      - The permit and utility review serve different purposes. City approval does not by itself mean the system can be turned on. Installation, required inspections, utility review, and meter work may need to happen before the system receives approval to operate.
      - Forms, fees, rate rules, and review steps can change. A good written plan identifies who prepares the documents, who responds to requested changes, and which parts of the schedule depend on the city or utility. That makes delays easier to understand and keeps important tasks from falling between providers.
    image: section3
    imageAlt: Solar permit and electrical plans for an Idaho Falls project
  - type: prose
    tone: alt
    eyebrow: Homes and small businesses
    heading: Match the plan to how the building uses power
    paragraphs:
      - A home may use more electricity during winter heating, summer cooling, or evening family routines. Recent bills help show those changes. Tell the estimator about an electric vehicle, heat pump, hot tub, workshop, home addition, or other planned load so the conversation does not depend only on past use.
      - A small business may use most of its power during daylight hours. It may also have a flat roof, larger electrical service, tenants, delivery times, or work-hour limits. Owners and property managers may need approval from other decision-makers before roof or electrical work begins.
      - Power use does not set the final size by itself. Roof area, shade, utility rules, budget, and equipment also matter. The goal is a plan that fits the property and the owner’s priorities—not the largest array that can be drawn on an aerial image.
  - type: prose
    eyebrow: Complete system planning
    heading: Compare more than panel brands
    paragraphs:
      - Panels are only one part of the system. Mounts, inverters, wiring, shutoff switches, labels, monitoring, and the main electrical service all have jobs to do. Each part must work with the approved design and the other equipment.
      - Ask where the inverter and shutoff equipment will go, how wires will run, and how workers will reach the roof. Ask which equipment is included and what written coverage applies. This website does not make a warranty claim because no warranty terms were provided.
      - Battery storage is not listed as a confirmed service on this site. If backup power matters to you, mention it during the estimate so the written plan can say whether it is excluded or needs a separate provider. Never assume a standard grid-connected solar system will power the building during an outage.
