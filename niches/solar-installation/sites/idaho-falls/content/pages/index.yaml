  - type: prose
    eyebrow: Solar installation cost
    heading: Why an Idaho Falls solar estimate needs local details
    paragraphs:
      - Solar panel installation cost in Idaho Falls cannot be set by panel count alone. System size is important, but roof condition, mounts, access, electrical work, engineering, permits, and the utility connection also affect the price. A ground-mounted system may add footings, trenching, grading, or a longer wire run.
      - Ask for a written estimate that lists the main equipment and every major step. It should explain design work, permits, installation, inspection, Idaho Falls Power documents, and final utility tasks. Look for items not included as carefully as the work that is included.
      - Low starting prices can leave out roof repairs, electrical-panel changes, trenching, or requested plan updates. Ask how unknown conditions will be handled and whether you must approve a written price change before extra work begins.
      - Tax and incentive pages become outdated quickly. Current IRS guidance says the Residential Clean Energy Credit is not available for new systems placed in service after December 31, 2025. Check current federal, state, city, and utility sources. A solar company’s marketing page is not personal tax advice.
      - A free solar estimate gives you a useful starting point, but the final price may require a site review and completed design. The goal is not a rushed number. It is a clear plan that you can understand and compare.
