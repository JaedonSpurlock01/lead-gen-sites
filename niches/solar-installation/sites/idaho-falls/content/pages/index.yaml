  - type: prose
    eyebrow: Property review
    heading: Look beyond the open space on the roof
    paragraphs:
      - A roof can look sunny from the street and still have limits. Vents, valleys, ridges, chimneys, nearby trees, required walkways, and shade at different times of year can reduce the usable area. Roof age and condition matter because panels may remain in place for many years. If the roof will need work soon, it may make sense to address that first.
      - The main electrical panel and meter location also affect the layout. Workers need a safe wire path from the panels to the inverter and electrical service. Long routes, finished walls, detached buildings, or a full electrical panel can change the work. An estimate should call out those facts instead of hiding them in a general price.
      - Ground-mounted solar can help when the roof is shaded, small, or pointed in a less useful direction. It also brings new questions about land, setbacks, trenching, grading, soil, snow drift, mowing, and the distance to electrical equipment. A larger open area does not always mean a simpler job.
      - Photos and satellite views help with an early conversation, but they do not show every roof or electrical condition. A final plan may need measurements, structural information, electrical details, and a closer look at the site.
    bullets:
      - Roof age, material, slope, and condition
      - Shade through summer and winter
      - Safe access and space around roof features
      - Electrical panel, meter, and wire route
      - Ground space, trenching, and snow drift
