      - heading: Electrical work
        text: The main electrical panel, wire routes, shutoff locations, and needed upgrades can change the work and price.
      - heading: Review and scheduling
        text: Engineering, permits, corrections, inspections, utility review, equipment availability, and weather affect the full timeline.
  - type: faq
    tone: alt
    eyebrow: Questions from property owners
    heading: Carson City solar panel installation FAQs
    intro: Use these answers as a planning overview. Property conditions and current agency requirements determine the final details.
    items:
      - question: Is Carson City sunny enough for solar panels?
        answer: Carson City has many sunny days, but suitability depends on the specific property. Shade, roof orientation, usable area, mounting conditions, electricity use, and system design all influence expected production and project value.
      - question: Will solar panels produce electricity when it is cold or snowy?
        answer: Panels can generate electricity in cold weather when sunlight reaches them. Snow cover, storms, shorter winter days, and shade can reduce output. A useful annual estimate includes seasonal conditions rather than assuming summer production all year.
      - question: Does a Carson City solar project need permits?
        answer: Solar work usually needs city review and inspection. The permit package may need roof and electrical plans. Historic District properties may need another review. Check the current rules for the project address.
      - question: How does the NV Energy grid connection fit into the project?
        answer: A grid-connected system must follow the utility’s current application and technical process. Installation, local inspection, utility review, and permission to operate are separate milestones. The specific sequence depends on the project.
      - question: How much does solar panel installation cost in Carson City?
        answer: The price depends on system size, equipment, mounting conditions, roof or land work, electrical requirements, access, engineering, permits, and utility steps. A property-specific written estimate is more useful than a generic per-panel figure.
      - question: Is the federal 30 percent residential solar credit available in 2026?
        answer: Current IRS guidance says the Residential Clean Energy Credit is not available for new systems placed in service after December 31, 2025. Tax rules can be hard to follow, so check the latest IRS guidance and ask a tax professional.
      - question: What should I prepare before requesting an estimate?
        answer: Gather recent electric bills, the roof age and material if known, photos, information about shade, and notes about future loads such as an electric vehicle or heat pump. Explain whether you are considering a roof or ground installation.
