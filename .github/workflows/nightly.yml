# Nightly read-only health check of every live domain. Fails (and emails the repo owner) when a
# zone, certificate, Worker attachment, apex or www redirect is wrong. Never posts test leads.
name: Nightly domains check

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domains-check:
    runs-on: ubuntu-latest
    # The Cloudflare secrets are environment secrets on `production`, not repo secrets.
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: domains check all
        env:
          # A read-only token (see README "CI token permissions"); the deploy token is not needed here.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm domains check all
