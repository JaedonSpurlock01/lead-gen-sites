# Pull requests: validate, test and build what the PR touches. Never deploys and needs no secrets.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check every site
        run: pnpm check all
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Work out which sites this PR affects
        id: affected
        run: echo "target=$(pnpm -s affected --base origin/${{ github.base_ref }} --head HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build affected sites
        if: steps.affected.outputs.target != ''
        run: pnpm build "${{ steps.affected.outputs.target }}" --concurrency 2
